suite: SecretProviderClass (tests) tests
templates:
  - templates/secretproviderclass-tests.yaml
# NOTE: the CI pipeline merges this chart's ci-values.yaml (which sets
# global.enableKeyVaults: true) as a base values file alongside these tests'
# own `set:` overrides, so tests that need enableKeyVaults=false explicitly
# set it rather than relying on chart defaults.
tests:
  - it: should not render when global.enableKeyVaults is false
    set:
      global.enableKeyVaults: false
      testsConfig:
        keyVaults:
          my-vault:
            secrets:
              - my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when testsConfig.keyVaults is not set, even if enableKeyVaults is true
    set:
      global.enableKeyVaults: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one SecretProviderClass per tests vault when conditions are met
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      testsConfig:
        keyVaults:
          my-vault:
            secrets:
              - my-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: SecretProviderClass
      - equal:
          path: metadata.name
          value: release-name-java-tests-my-vault
