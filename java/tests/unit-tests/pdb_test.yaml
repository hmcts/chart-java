suite: PodDisruptionBudget tests
templates:
  - templates/pdb.yaml
tests:
  - it: should render a PDB by default since pdb.enabled is true in this chart's values
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: release-name-java-pdb

  - it: should not render PDB when pdb.enabled is false
    set:
      pdb.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the chart default maxUnavailable of 50%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 50%

  - it: should set minAvailable when pdb.minAvailable is provided, taking precedence over maxUnavailable
    set:
      pdb.minAvailable: 1
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable
