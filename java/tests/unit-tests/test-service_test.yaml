suite: Test-hook Service Pod tests
templates:
  - templates/tests/test-service.yaml
tests:
  - it: should render a Pod helm test hook
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test-success

  - it: should name the pod using the release name template with a -test suffix
    asserts:
      - equal:
          path: metadata.name
          value: release-name-java-test

  - it: should point SERVICE_NAME at the release's Service name
    asserts:
      - equal:
          path: spec.containers[0].env[0].value
          value: release-name-java

