suite: SecretProviderClass tests
templates:
  - templates/secretproviderclass.yaml
# NOTE: the CI pipeline merges this chart's ci-values.yaml (which defines a real
# "plumsi" keyVault entry and global.enableKeyVaults: true) as a base values file
# alongside these tests' own `set:` overrides. Every test below therefore sets
# `global.enableKeyVaults` explicitly (rather than relying on chart defaults).
# Where a test also sets its own `keyVaults` map, it force-disables the inherited
# "plumsi" entry (`plumsi: {disabled: true}`) rather than nulling it out --
# setting a map key to a literal `null` here isn't stripped by the values merge,
# it's preserved as a nil map entry and crashes the template's `range` with a nil
# pointer dereference on `$info.disabled`.
tests:
  - it: should not render when global.enableKeyVaults is false
    set:
      global.enableKeyVaults: false
      keyVaults:
        plumsi:
          disabled: true
        my-vault:
          secrets:
            - my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when keyVaults is not set, even if enableKeyVaults is true
    set:
      global.enableKeyVaults: true
      keyVaults: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one SecretProviderClass per vault when conditions are met
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        plumsi:
          disabled: true
        my-vault:
          secrets:
            - my-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: SecretProviderClass
      - equal:
          path: metadata.name
          value: release-name-java-my-vault

  - it: should include environment suffix in keyvaultName when excludeEnvironmentSuffix is false
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        plumsi:
          disabled: true
        my-vault:
          excludeEnvironmentSuffix: false
          secrets:
            - my-secret
    asserts:
      - equal:
          path: spec.parameters.keyvaultName
          value: my-vault-aat

  - it: should not render a SecretProviderClass for a disabled vault
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        plumsi:
          disabled: true
        vault-a:
          disabled: true
          secrets:
            - secret-a
        vault-b:
          secrets:
            - secret-b
    asserts:
      - hasDocuments:
          count: 1

  - it: should use usePodIdentity since no workload identity service account annotation is available in unit tests
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      useWorkloadIdentity: true
      keyVaults:
        plumsi:
          disabled: true
        my-vault:
          secrets:
            - my-secret
    asserts:
      - equal:
          path: spec.parameters.usePodIdentity
          value: "true"



