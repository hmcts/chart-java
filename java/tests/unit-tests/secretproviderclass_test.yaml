suite: SecretProviderClass tests
templates:
  - templates/secretproviderclass.yaml
tests:
  - it: should not render when global.enableKeyVaults is false (chart default)
    set:
      keyVaults:
        my-vault:
          secrets:
            - my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when keyVaults is not set, even if enableKeyVaults is true
    set:
      global.enableKeyVaults: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one SecretProviderClass per vault when conditions are met
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          secrets:
            - my-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: SecretProviderClass
      - equal:
          path: metadata.name
          value: release-name-java-my-vault

  - it: should include environment suffix in keyvaultName when excludeEnvironmentSuffix is false
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          excludeEnvironmentSuffix: false
          secrets:
            - my-secret
    asserts:
      - equal:
          path: spec.parameters.keyvaultName
          value: my-vault-aat

  - it: should not render a SecretProviderClass for a disabled vault
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        vault-a:
          disabled: true
          secrets:
            - secret-a
        vault-b:
          secrets:
            - secret-b
    asserts:
      - hasDocuments:
          count: 1

  - it: should use usePodIdentity since no workload identity service account annotation is available in unit tests
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      useWorkloadIdentity: true
      keyVaults:
        my-vault:
          secrets:
            - my-secret
    asserts:
      - equal:
          path: spec.parameters.usePodIdentity
          value: "true"
